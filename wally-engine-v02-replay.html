<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Astra (Ultra) vs. Wally — Game replay</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='34'%3E♞%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark light; --page:#111b18; --surface:#1a2722; --hover:#263a30; --text:#edf2e9; --muted:#a9bbae; --line:#33483c; --accent:#c7e89f; --on-accent:#182914; --light-square:#e8edda; --dark-square:#789580; --last-light:#e8df9b; --last-dark:#b7bc75; --check:#d87e71; }
    @media(prefers-color-scheme:light) { :root { --page:#f5f6ef; --surface:#fffef7; --hover:#e7ecdf; --text:#263b2d; --muted:#637562; --line:#d5dfcf; --accent:#395f40; --on-accent:#fffef7; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,select,input { font:inherit; }
    button,select { color:inherit; }
    button { cursor:pointer; }
    button:disabled { opacity:.3; cursor:default; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .app { max-width:1050px; margin:0 auto; padding:28px 28px 22px; }
    .heading { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
    .eyebrow { margin:0 0 5px; color:var(--muted); font-size:11px; letter-spacing:.17em; font-weight:600; }
    h1 { margin:0; font:400 clamp(25px,4vw,34px)/1.2 Georgia,"Times New Roman",serif; letter-spacing:-.02em; }
    .subtitle { margin:7px 0 0; color:var(--muted); font-size:12px; }
    .result { display:flex; flex-direction:column; align-items:center; flex-shrink:0; border:1px solid var(--line); border-radius:12px; padding:9px 15px; gap:1px; }
    .result strong { font-size:22px; font-weight:500; letter-spacing:.1em; color:var(--accent); }
    .result span { font-size:11px; color:var(--muted); }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 260px; align-items:start; gap:30px; }
    .board-column { min-width:0; }
    .player { display:flex; justify-content:space-between; align-items:center; min-height:39px; gap:8px; padding:0 0 9px 18px; }
    .player.bottom { padding:10px 0 0 18px; }
    .engine-score { margin:16px 0 0 18px; padding:12px 14px; border:1px solid var(--line); border-radius:9px; background:var(--surface); }
    .engine-score[hidden] { display:none; }
    .engine-score .label { margin:0 0 3px; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
    .engine-score strong { display:block; color:var(--accent); font-size:19px; font-weight:500; font-variant-numeric:tabular-nums; }
    .engine-score p { margin:4px 0 0; font-size:11px; color:var(--muted); }
    .engine-score details { margin-top:6px; font-size:11px; color:var(--muted); }
    .engine-score summary { cursor:pointer; }
    .player-name { display:flex; align-items:center; gap:8px; font-weight:500; }
    .color-dot { width:10px; height:10px; border:1px solid #879584; border-radius:50%; flex-shrink:0; }
    .color-dot.white { background:#f9faee; }
    .color-dot.black { background:#203025; }
    .player-meta { color:var(--muted); font-size:12px; font-weight:400; }
    .turn { color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
    .board-wrap { position:relative; padding:0 0 18px 18px; }
    .board { position:relative; width:100%; aspect-ratio:1; overflow:hidden; border-radius:4px; container-type:inline-size; box-shadow:0 8px 26px #00000016; }
    .squares { position:absolute; inset:0; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); }
    .square { background:var(--light-square); }
    .square.dark { background:var(--dark-square); }
    .square.last { background:var(--last-light); }
    .square.dark.last { background:var(--last-dark); }
    .square.check { background:var(--check); }
    .piece { position:absolute; inset:0 auto auto 0; width:12.5%; height:12.5%; display:flex; align-items:center; justify-content:center; transition:transform 320ms cubic-bezier(.25,.7,.25,1),opacity 180ms ease; will-change:transform; pointer-events:none; }
    .piece span { display:block; font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif; font-size:10cqw; line-height:1; transform:translateY(-.025em); }
    .piece.white span { color:#fffff3; -webkit-text-stroke:1.1px #354b3d; filter:drop-shadow(0 2px 1px #263a3045); }
    .piece.black span { color:#203126; -webkit-text-stroke:.6px #e6ecd4; filter:drop-shadow(0 2px 1px #263a3030); }
    .board.instant .piece { transition:none; }
    .files { position:absolute; bottom:0; left:18px; right:0; display:grid; grid-template-columns:repeat(8,1fr); text-align:center; height:18px; align-items:end; color:var(--muted); font-size:11px; }
    .ranks { position:absolute; left:0; top:0; bottom:18px; width:18px; display:grid; grid-template-rows:repeat(8,1fr); align-items:center; color:var(--muted); font-size:11px; }
    .transport { margin:20px 0 0 18px; }
    .position-line { display:flex; justify-content:space-between; gap:12px; align-items:baseline; margin-bottom:9px; }
    .position-title { font-weight:500; }
    .position-count { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .timeline { accent-color:var(--accent); width:100%; margin:0; cursor:pointer; height:22px; }
    .controls { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; }
    .icon-button { width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; padding:0; border:1px solid var(--line); border-radius:9px; background:transparent; }
    .icon-button:hover:not(:disabled),.quiet:hover { background:var(--hover); }
    .icon-button svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .play { width:84px; gap:7px; border-color:var(--accent); background:var(--accent); color:var(--on-accent); font-weight:600; }
    .play:hover:not(:disabled) { background:var(--accent); filter:brightness(.95); }
    .secondary-controls { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:15px; }
    .quiet { display:inline-flex; gap:6px; align-items:center; border:0; background:transparent; color:var(--muted); padding:6px 0; border-radius:4px; font-size:12px; text-decoration:none; }
    .quiet svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .speed-label { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
    select { border:1px solid var(--line); border-radius:6px; padding:4px 7px; background:var(--surface); font-size:12px; }
    .moves-panel { border:1px solid var(--line); border-radius:12px; background:var(--surface); overflow:hidden; }
    .moves-heading { display:flex; justify-content:space-between; align-items:center; padding:16px 16px 12px; }
    .moves-heading h2 { font-size:14px; font-weight:500; margin:0; }
    .moves-heading span { color:var(--muted); font-size:12px; }
    .columns { display:grid; grid-template-columns:30px 1fr 1fr; gap:5px; padding:0 13px 9px; color:var(--muted); font-size:11px; border-bottom:1px solid var(--line); }
    .move-list { max-height:455px; overflow-y:auto; overscroll-behavior:contain; padding:7px; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
    .move-row { display:grid; grid-template-columns:30px minmax(0,1fr) minmax(0,1fr); gap:5px; align-items:center; padding:2px 0; }
    .move-number { color:var(--muted); text-align:center; font-size:12px; font-variant-numeric:tabular-nums; }
    .move-button { display:block; border:0; border-radius:5px; background:transparent; padding:7px 6px; text-align:left; font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .move-button:hover { background:var(--hover); }
    .move-button[aria-current="step"] { background:var(--accent); color:var(--on-accent); font-weight:600; }
    .selection { border-top:1px solid var(--line); padding:14px 16px 16px; min-height:98px; }
    .selection .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.09em; margin:0 0 5px; }
    .selection p { margin:0; font-size:13px; }
    .selection small { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    .footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px 18px; margin:18px 0 0 18px; border-top:1px solid var(--line); padding-top:12px; color:var(--muted); font-size:11px; }
    .footer .quiet { font-size:11px; padding:0; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .error { color:#d98175; padding:16px; }
    @media(min-width:781px) {
      :root { --board-track:clamp(320px,calc(100dvh - 410px),600px); }
      .app { max-width:calc(var(--board-track) + 346px); padding-top:22px; padding-bottom:16px; }
      .layout { grid-template-columns:minmax(0,var(--board-track)) 260px; }
      .heading { margin-bottom:18px; }
      .moves-panel { margin-top:39px; }
      .move-list { max-height:calc(var(--board-track) - 121px); }
    }
    @media(max-width:780px) { .app { max-width:620px; padding:22px 20px; } .layout { grid-template-columns:1fr; gap:22px; } .move-list { max-height:205px; } .selection { min-height:0; } .heading { margin-bottom:19px; } }

    @media(pointer:coarse) { .icon-button { min-width:44px; min-height:44px; } .move-button { min-height:44px; } .quiet,select { min-height:40px; } }
    @media(prefers-reduced-motion:reduce) { .piece { transition:none; } }
  </style>
</head>

p"},{"id":"P-e2","square":"e3","color":"white","type":"p"},{"id":"p-c7","square":"c5","color":"black","type":"p"},{"id":"p-d7","square":"d5","color":"black","type":"p"},{"id":"p-e7","square":"e5","color":"black","type":"p"},{"id":"b-c8","square":"f5","color":"black","type":"b"},{"id":"N-g1","square":"c6","color":"white","type":"n"},{"id":"p-g7","square":"g6","color":"black","type":"p"},{"id":"p-h7","square":"h6","color":"black","type":"p"},{"id":"p-f7","square":"f7","color":"black","type":"p"},{"id":"k-e8","square":"h7","color":"black","type":"k"},{"id":"Q-d1","square":"f8","color":"white","type":"q"},{"id":"R-a1","square":"g8","color":"white","type":"r"}],"move":{"san":"dxc5","number":30,"color":"black","type":"p","from":"d6","to":"c5","uci":"d6c5","captured":"p","promotion":null,"castle":false},"evaluation":null},{"fen":"6R1/5Q1k/2N3pp/2pppb2/8/4P3/P1P2PPP/5RK1 b - - 0 31","turn":"black","check":"h7","mate":true,"pieces":[{"id":"R-h1","square":"f1","color":"white","type":"r"},{"id":"K-e1","square":"g1","color":"white","type":"k"},{"id":"P-a2","square":"a2","color":"white","type":"p"},{"id":"P-c2","square":"c2","color":"white","type":"p"},{"id":"P-f2","square":"f2","color":"white","type":"p"},{"id":"P-g2","square":"g2","color":"white","type":"p"},{"id":"P-h2","square":"h2","color":"white","type":"p"},{"id":"P-e2","square":"e3","color":"white","type":"p"},{"id":"p-c7","square":"c5","color":"black","type":"p"},{"id":"p-d7","square":"d5","color":"black","type":"p"},{"id":"p-e7","square":"e5","color":"black","type":"p"},{"id":"b-c8","square":"f5","color":"black","type":"b"},{"id":"N-g1","square":"c6","color":"white","type":"n"},{"id":"p-g7","square":"g6","color":"black","type":"p"},{"id":"p-h7","square":"h6","color":"black","type":"p"},{"id":"Q-d1","square":"f7","color":"white","type":"q"},{"id":"k-e8","square":"h7","color":"black","type":"k"},{"id":"R-a1","square":"g8","color":"white","type":"r"}],"move":{"san":"Qxf7#","number":31,"color":"white","type":"q","from":"f8","to":"f7","uci":"f8f7","captured":"p","promotion":null,"castle":false},"evaluation":{"kind":"actual_checkmate","forMove":"31. Qxf7#","source":"engine-games/wally-engine-v02/game.json","scoreCp":null,"depth":null,"mateMovesRemaining":null,"label":"Checkmate","detail":"31. Qxf7# \u00b7 White wins","note":"The recorded game ended here. No engine search score was needed for the final move."}}],"displayNames":{"white":"Astra","black":"Wally"},"outcome":{"reason":"checkmate","label":"Checkmate","winner":"white","description":"White won by checkmate","detail":"Checkmate \u00b7 White wins"},"evaluations":{"perspective":"white","recordedChoices":31,"description":"Historical engine results for Astra's chosen moves. Scores were calculated before each White move; Black replies have no recorded evaluation.","mateConvention":"Mate labels count the mating side's moves remaining from the displayed board. Search-root mate distances include the chosen White move."}}</script>
<script>
(() => {
  'use strict';
  const root = document.getElementById('chess-replay');
  const $ = (id) => root.querySelector('#' + id);
  const data = JSON.parse(document.getElementById('replay-data').textContent);
  const frames = data.frames;
  const end = frames.length - 1;
  const glyph = {k:'♚', q:'♛', r:'♜', b:'♝', n:'♞', p:'♟'};
  const names = {k:'King', q:'Queen', r:'Rook', b:'Bishop', n:'Knight', p:'Pawn'};
  const board = $('board');
  const pieces = new Map();
  const squareNodes = new Map();
  const moveButtons = new Map();
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let index = 0, flipped = false, playing = false, timer = null, generation = 0;

  for (let rank = 1; rank <= 8; rank++) {
    for (const file of 'abcdefgh') {
      const sq = file + rank;
      const el = document.createElement('div');
      el.className = 'square';
      el.dataset.square = sq;
      $('squares').append(el);
      squareNodes.set(sq, el);
    }
  }
  for (const p of frames[0].pieces) {
    const el = document.createElement('div');
    el.className = 'piece ' + p.color;
    el.dataset.piece = p.id;
    const symbol = document.createElement('span');
    symbol.textContent = glyph[p.type];
    el.append(symbol);
    $('pieces').append(el);
    pieces.set(p.id, el);
  }
  for (let ply = 1; ply <= end; ply += 2) {
    const row = document.createElement('div');
    row.className = 'move-row';
    const number = document.createElement('span');
    number.className = 'move-number';
    number.textContent = Math.ceil(ply / 2) + '.';
    row.append(number);
    for (const i of [ply, ply + 1]) {
      if (i > end) { row.append(document.createElement('span')); continue; }
      const m = frames[i].move;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'move-button';
      button.dataset.ply = i;
      button.textContent = m.san;
      button.setAttribute('aria-label', `${m.color === 'white' ? 'White' : 'Black'} move ${m.number}: ${m.san}`);
      row.append(button);
      moveButtons.set(i, button);
    }
    $('move-list').append(row);
  }

  function xy(square) {
    const x = square.charCodeAt(0) - 97;
    const y = 8 - Number(square[1]);
    return flipped ? [7 - x, 7 - y] : [x, y];
  }
  function player(element, color, frame) {
    const white = color === 'white';
    const side = white ? 'White' : 'Black';
    const rating = data.headers[side + 'Elo'];
    element.innerHTML = `<span class="player-name"><span class="color-dot ${color}"></span><span class="name-text"></span><span class="player-meta"></span></span><span class="turn"></span>`;
    element.querySelector('.name-text').textContent = data.displayNames[color];
    element.querySelector('.player-meta').textContent = rating && rating !== '?' ? `${rating} · ${side}` : side;
    element.querySelector('.turn').textContent = index === end
      ? (data.outcome.winner === color ? 'Winner' : (data.outcome.reason === 'resignation' ? 'Resigned' : 'Checkmate'))
      : (frame.turn === color ? 'To move' : '');
  }
  function pause() {
    playing = false;
    window.clearTimeout(timer);
    timer = null;
    $('play-label').textContent = index === end ? 'Replay' : 'Play';
    $('play').setAttribute('aria-label', index === end ? 'Replay from start' : 'Play replay');
    $('play').setAttribute('aria-pressed', 'false');
    $('play-icon').innerHTML = '<path d="m6 3 10 7-10 7z"/>';
  }
  function schedule() {
    window.clearTimeout(timer);
    if (!playing) return;
    timer = window.setTimeout(() => {
      if (!playing) return;
      show(index + 1, true);
      if (index === end) pause(); else schedule();
    }, Number($('speed').value));
  }
  function togglePlay() {
    if (playing) { pause(); return; }
    if (index === end) show(0, false);
    playing = true;
    $('play-label').textContent = 'Pause';
    $('play').setAttribute('aria-label', 'Pause replay');
    $('play').setAttribute('aria-pressed', 'true');
    $('play-icon').innerHTML = '<path d="M7 4v12M13 4v12"/>';
    schedule();
  }
  function keepMoveVisible(button) {
    const list = $('move-list');
    if (!button) { list.scrollTop = 0; return; }
    const row = button.parentElement;
    const listBox = list.getBoundingClientRect();
    const rowBox = row.getBoundingClientRect();
    if (rowBox.top < listBox.top + 5) list.scrollTop -= listBox.top + 5 - rowBox.top;
    else if (rowBox.bottom > listBox.bottom - 5) list.scrollTop += rowBox.bottom - listBox.bottom + 5;
  }
  function showEvaluation(frame) {
    $('engine-score').hidden = !data.evaluations;
    if (!data.evaluations) return;
    const value = frame.evaluation;
    if (value) {
      $('engine-score-value').textContent = value.label;
      $('engine-score-detail').textContent = value.detail;
      $('engine-score-note').textContent = value.note;
    } else {
      $('engine-score-value').textContent = 'No recorded evaluation';
      $('engine-score-detail').textContent = !frame.move ? 'Starting position' : frame.move.color === 'black'
        ? 'No score was logged after this Black reply.' : 'No search result was recorded for this choice.';
      $('engine-score-note').textContent = data.evaluations.description;
    }
  }
  function show(target, animate) {
    const next = Math.max(0, Math.min(end, target));
    const doAnimate = animate && Math.abs(next - index) <= 1 && !reducedMotion.matches;
    const token = ++generation;
    board.classList.toggle('instant', !doAnimate);
    // Flush the transition mode before changing positions, including rapid scrubbing.
    board.getBoundingClientRect();
    index = next;
    const frame = frames[index];
    const m = frame.move;
    const visible = new Set(frame.pieces.map(p => p.id));
    for (const [id, el] of pieces) {
      el.style.opacity = visible.has(id) ? '1' : '0';
      el.dataset.present = visible.has(id) ? 'true' : 'false';
    }
    for (const p of frame.pieces) {
      const el = pieces.get(p.id);
      const [x, y] = xy(p.square);
      el.style.transform = `translate(${x * 100}%, ${y * 100}%)`;
      el.style.zIndex = m && (p.square === m.to || p.square === m.from) ? '2' : '1';
      el.dataset.square = p.square;
      el.dataset.type = p.type;
      el.firstElementChild.textContent = glyph[p.type];
    }
    for (const [sq, el] of squareNodes) {
      const [x, y] = xy(sq);
      el.style.gridColumn = x + 1;
      el.style.gridRow = y + 1;
      el.className = 'square' + ((sq.charCodeAt(0) - 97 + Number(sq[1])) % 2 === 1 ? ' dark' : '')
        + (m && (m.from === sq || m.to === sq) ? ' last' : '')
        + (frame.check === sq ? ' check' : '');
    }
    $('files').innerHTML = [...(flipped ? 'hgfedcba' : 'abcdefgh')].map(f => `<span>${f}</span>`).join('');
    $('ranks').innerHTML = (flipped ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1]).map(r => `<span>${r}</span>`).join('');
    player($('top-player'), flipped ? 'white' : 'black', frame);
    player($('bottom-player'), flipped ? 'black' : 'white', frame);
    showEvaluation(frame);
    const moveLabel = m ? `${m.number}${m.color === 'white' ? '.' : '…'} ${m.san}` : 'Starting position';
    const positionLabel = index === end ? `${moveLabel} · ${data.outcome.label}` : moveLabel;
    $('position-title').textContent = positionLabel;
    $('position-count').textContent = `${index} / ${end}`;
    $('timeline').value = index;
    $('timeline').max = end;
    $('timeline').setAttribute('aria-valuetext', `${positionLabel}, position ${index} of ${end}`);
    $('first').disabled = $('previous').disabled = index === 0;
    $('next').disabled = $('last').disabled = index === end;
    for (const [ply, button] of moveButtons) {
      if (ply === index) button.setAttribute('aria-current', 'step');
      else button.removeAttribute('aria-current');
    }
    $('selected-label').textContent = m ? `${m.color === 'white' ? 'White' : 'Black'} · Move ${m.number}` : 'Position';
    $('selected-move').textContent = m ? `${names[m.type]} ${m.from} → ${m.to}` : 'Starting position';
    const details = [];
    if (m && m.castle) details.push(m.to[0] === 'g' ? 'Kingside castling' : 'Queenside castling');
    if (m && m.captured) details.push(`Captures ${names[m.captured].toLowerCase()}`);
    if (m && m.promotion) details.push(`Promotes to ${names[m.promotion].toLowerCase()}`);
    if (index === end) details.push(data.outcome.detail);
    else if (frame.check) details.push('Check');
    if (!details.length) details.push(`${frame.turn === 'white' ? 'White' : 'Black'} to move`);
    $('selected-detail').textContent = details.join(' · ');
    board.setAttribute('aria-label', `Chessboard after ${positionLabel}. ${index === end ? data.outcome.description + '.' : frame.turn + ' to move.'}`);
    board.dataset.ply = index;
    board.dataset.fen = frame.fen;
    $('board-description').textContent = frame.pieces.map(p => `${p.color} ${names[p.type].toLowerCase()} on ${p.square}`).join('; ');
    keepMoveVisible(moveButtons.get(index));
    if (!playing) pause();
    window.requestAnimationFrame(() => { if (generation === token) board.classList.remove('instant'); });
  }
  function seek(position) { pause(); show(position, true); }
  $('first').addEventListener('click', () => seek(0));
  $('previous').addEventListener('click', () => seek(index - 1));
  $('next').addEventListener('click', () => seek(index + 1));
  $('last').addEventListener('click', () => seek(end));
  $('play').addEventListener('click', togglePlay);
  $('timeline').addEventListener('input', event => seek(Number(event.target.value)));
  $('speed').addEventListener('change', () => { if (playing) schedule(); });
  $('flip').addEventListener('click', () => { flipped = !flipped; show(index, false); });
  $('move-list').addEventListener('click', event => {
    const button = event.target.closest('button[data-ply]');
    if (button) seek(Number(button.dataset.ply));
  });
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey || event.target.isContentEditable) return;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)) return;
    if (event.key === 'ArrowLeft') { event.preventDefault(); seek(index - 1); }
    else if (event.key === 'ArrowRight') { event.preventDefault(); seek(index + 1); }
    else if (event.key === 'Home') { event.preventDefault(); seek(0); }
    else if (event.key === 'End') { event.preventDefault(); seek(end); }
    else if (event.code === 'Space' && !/^(BUTTON|A)$/.test(event.target.tagName)) { event.preventDefault(); togglePlay(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  const downloadUrl = URL.createObjectURL(new Blob([data.pgn], {type:'application/x-chess-pgn'}));
  $('download-pgn').href = downloadUrl;
  window.addEventListener('pagehide', () => { pause(); });
  show(0, false);
})();
</script>
